name: Native test gates
on:
  push:
    branches: [wiejskapaka-import, 'preview/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  WP_ENV: test
  DATABASE_URL: ""
  NEON_DATABASE_URL: ""

jobs:
  windows_recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - name: Synthetic SNS signature diagnostics
        run: python -m pytest -q tests/test_sns_pinned_notification.py --tb=short
      - name: Synthetic SNS HTTP boundary diagnostics
        run: python -m pytest -q tests/test_ses_feedback_http.py --tb=short
      - name: Quick Windows demo, recovery and settlement gate
        run: python -m scripts.run_native_ci windows-recovery --report "${{ runner.temp }}/ci/windows-recovery.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-recovery-summary
          path: ${{ runner.temp }}/ci/windows-recovery.json
          retention-days: 7

  windows:
    needs: windows_recovery
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - name: Full isolated Windows regression
        run: python -m scripts.run_native_ci windows --report "${{ runner.temp }}/ci/windows.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-summary
          path: ${{ runner.temp }}/ci/windows.json
          retention-days: 7

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: wp_test_ci
          POSTGRES_USER: wp_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wp_ci -d wp_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Install matching PostgreSQL backup clients
        run: |
          # Ubuntu 24.04 ships client 16; 17 comes from the official PGDG repo.
          if [ "${{ matrix.postgres-version }}" = "17" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location \
              --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          fi
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-${{ matrix.postgres-version }}
          echo "/usr/lib/postgresql/${{ matrix.postgres-version }}/bin" >> "$GITHUB_PATH"
      - name: Native PostgreSQL, restricted application role and real HTTP
        env:
          WP_TEST_POSTGRES_DSN: postgresql://wp_ci:disposable-ci-only@127.0.0.1:5432/wp_test_ci
        run: python -m scripts.run_native_ci postgres --report "${{ runner.temp }}/ci/postgres.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: postgres-${{ matrix.postgres-version }}-summary
          path: ${{ runner.temp }}/ci/postgres.json
          retention-days: 7

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - name: Expose the installed test browser to existing gates
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              binary = Path(p.chromium.executable_path)
          assert binary.is_file()
          folder = Path(os.environ["RUNNER_TEMP"]) / "test-browser-bin"
          folder.mkdir()
          (folder / "chromium").symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(folder) + "\n")
          PY
      - name: Offline roles and real HTTP at five viewport sizes
        run: python -m scripts.run_native_ci browser --report "${{ runner.temp }}/ci/browser.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: chromium-summary
          path: ${{ runner.temp }}/ci/browser.json
          retention-days: 7
