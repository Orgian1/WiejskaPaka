name: Demo final acceptance
on:
  push:
    branches: ['release/demo-final-20261116']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-final-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  WP_ENV: test
  DATABASE_URL: ''
  NEON_DATABASE_URL: ''
jobs:
  windows_cmd:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify unchanged previously tested application
        run: git diff --exit-code 87c0848beba919303d48562ecb04e4c8a2792b6a HEAD -- backend web database scripts requirements.txt requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - name: Execute actual CMD from extracted ZIP and verify cancellation status
        run: python -m pytest -q tests/test_windows_cmd_launcher.py --junitxml=work/windows-cmd.xml --tb=short
      - name: Windows recovery and isolated startup regression
        run: python -m scripts.run_native_ci windows-recovery --report work/windows-recovery.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-windows
          path: |
            work/windows-cmd.xml
            work/windows-recovery.json
          retention-days: 14
  linux_final:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-security-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify unchanged previously tested application
        run: git diff --exit-code 87c0848beba919303d48562ecb04e4c8a2792b6a HEAD -- backend web database scripts requirements.txt requirements-lock.txt
      - run: python -m pip install -r requirements-security-test.txt
      - name: Final purchase, PIN, ratings, wallet, money, privacy and restart regression
        run: >-
          python scripts/run_tests_per_file.py
          test_demo_purchase_pin_rating_wallet_ads.py test_wallet_ads_http.py
          test_seller_ratings_http.py test_wallet_integrity.py
          test_b1801_concurrent_stock.py test_purchase_record_http_restart.py
          test_crash_checkout_http.py test_contact_demo_http.py
          test_full_local_demo.py test_demo_readiness.py
          test_b6961_auth_dependency_inventory.py
          --timeout 180 --report work/focused-raw.json
      - name: Disposable PostgreSQL RLS and API coverage
        run: python -m scripts.run_rls_api_gate --report work/rls.xml --coverage work/rls-routes.jsonl
      - name: Sanitize test summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('work/focused-raw.json')
          if path.is_file():
              data=json.loads(path.read_text())
              for row in data.get('results',[]):
                  row.pop('output_tail',None)
              Path('work/focused.json').write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-linux
          path: |
            work/focused.json
            work/rls.xml
            work/rls-routes.jsonl
          retention-days: 14
  chromium_final:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - name: Expose installed Chromium
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              binary=Path(p.chromium.executable_path)
          assert binary.is_file()
          folder=Path(os.environ['RUNNER_TEMP'])/'final-browser-bin'
          folder.mkdir()
          (folder/'chromium').symlink_to(binary)
          with open(os.environ['GITHUB_PATH'],'a') as output:
              output.write(str(folder)+'\n')
          PY
      - run: python -m scripts.run_native_ci browser --report work/browser.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-browser
          path: work/browser.json
          retention-days: 14
