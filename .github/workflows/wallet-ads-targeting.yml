name: Wallet ads role targeting checks
on:
  push:
    branches:
      - WIEJSKAPAKA-FINAL-WYGLAD-RLS-REKLAMY-20261116
  pull_request:
    paths:
      - 'backend/wallet_ads.py'
      - 'web/wallet-ads.js'
      - 'web/style.css'
      - 'database/**'
      - 'tests/test_wallet_ads_http.py'
      - 'backend/payu_preparation.py'
      - 'tests/test_payu_preparation.py'
      - 'backend/payu_journal_schema.py'
      - 'tests/test_payu_journal_schema.py'
      - 'backend/payu_state.py'
      - 'tests/test_payu_state.py'
      - 'backend/payu_reconciliation.py'
      - 'tests/test_payu_reconciliation.py'
      - 'backend/payu_config.py'
      - 'tests/test_payu_config.py'
      - 'backend/payu_notification.py'
      - 'tests/test_payu_notification.py'
      - '.github/workflows/wallet-ads-targeting.yml'
  workflow_dispatch:
jobs:
  wallet-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: JavaScript syntax check
        run: node --check web/wallet-ads.js
      - name: Compile backend and test code
        run: python -m py_compile backend/wallet_ads.py tests/test_wallet_ads_http.py backend/payu_preparation.py tests/test_payu_preparation.py backend/payu_journal_schema.py tests/test_payu_journal_schema.py backend/payu_state.py tests/test_payu_state.py backend/payu_reconciliation.py tests/test_payu_reconciliation.py backend/payu_config.py tests/test_payu_config.py backend/payu_notification.py tests/test_payu_notification.py
      - name: Wallet ads regression and targeting
        run: python -m pytest -q tests/test_wallet_ads_http.py tests/test_payu_preparation.py tests/test_payu_journal_schema.py tests/test_payu_state.py tests/test_payu_reconciliation.py tests/test_payu_config.py tests/test_payu_notification.py
