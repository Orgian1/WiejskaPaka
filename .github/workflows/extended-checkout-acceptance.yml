name: Extended checkout and delivery acceptance
on:
  push:
    branches:
      - WIEJSKAPAKA-FINAL-WYGLAD-RLS-REKLAMY-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WP_ENV: test
      DATABASE_URL: ''
      NEON_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Validate purchase, stock, delivery, cancellations and financial reconciliation
        run: python scripts/run_extended_release_gate.py
      - name: Upload extended gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-checkout-acceptance
          path: extended_release_gate_report.json
          if-no-files-found: ignore
