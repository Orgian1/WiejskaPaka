name: Wallet response diagnostic
on:
  push:
    branches: ['diagnostics/wallet-recovery-20261110']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_ENV: test
      DATABASE_URL: ''
      NEON_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - name: Expose installed browser
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              binary=Path(p.chromium.executable_path)
          folder=Path(os.environ['RUNNER_TEMP'])/'test-browser-bin'
          folder.mkdir()
          (folder/'chromium').symlink_to(binary)
          with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(folder)+'\n')
          PYCODE
      - run: python -m pytest -q tests/test_wallet_recovery_browser.py -k lost -x --tb=short -s
